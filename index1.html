<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Responsive Showcase</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
  font-family: Georgia, serif;
  background: #F1EFE6;
  color: #111;
}

/* NAVBAR */
.navbar {
  background: transparent;
}

/* HERO */
.hero {
  min-height: 100vh;
  display: flex;
  align-items: center;
}

.hero h1 {
  font-size: clamp(2.5rem, 8vw, 6rem);
  line-height: 1.1;
}

/* IMAGE GRID */
.grid-img {
  width: 100%;
  height: 400px;
  object-fit: cover;
}

/* SPLIT SECTION */
.split {
  min-height: 80vh;
  display: flex;
  align-items: center;
}

/* PORTFOLIO */
.portfolio img {
  width: 100%;
  height: 300px;
  object-fit: cover;
}

/* SPACING */
section {
  padding: 80px 0;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg p-3">
  <div class="container">
    <a class="navbar-brand" href="#">Studio</a>
  </div>
</nav>

<!-- HERO -->
<section class="hero">
  <div class="container">
    <h1>
      We design<br>
      digital experiences<br>
      that feel effortless
    </h1>
  </div>
</section>

<!-- GRID -->
<section>
  <div class="container">
    <div class="row g-3">
      <div class="col-md-6">
        <img src="https://picsum.photos/800/600?1" class="grid-img">
      </div>
      <div class="col-md-6">
        <img src="https://picsum.photos/800/600?2" class="grid-img">
      </div>
    </div>
  </div>
</section>

<!-- SPLIT -->
<section class="split">
  <div class="container">
    <div class="row align-items-center">
      
      <div class="col-md-6">
        <h2>Built for clarity</h2>
        <p>
          Every layout adapts seamlessly across devices. 
          Clean structure. No clutter.
        </p>
      </div>

      <div class="col-md-6">
        <img src="https://picsum.photos/800/600?3" class="img-fluid">
      </div>

    </div>
  </div>
</section>

<!-- PORTFOLIO -->
<section class="portfolio">
  <div class="container">
    <div class="row g-3">

      <div class="col-lg-4 col-md-6">
        <img src="https://picsum.photos/400/300?4">
      </div>

      <div class="col-lg-4 col-md-6">
        <img src="https://picsum.photos/400/300?5">
      </div>

      <div class="col-lg-4 col-md-6">
        <img src="https://picsum.photos/400/300?6">
      </div>

    </div>
  </div>
</section>

<!-- FOOTER -->
<footer class="text-center p-4">
  <p>© 2026 Studio</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
