<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>About</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body {
  background: #F1EFE6;
  color: #1e293b;
  font-family: Georgia, serif;
  position: relative;
  overflow-x: hidden;
}

/* SUBTLE GRID */
body::before {
  content: "";
  position: fixed;
  width: 100%;
  height: 100%;
  background-image: 
    linear-gradient(rgba(0,0,0,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,0,0.04) 1px, transparent 1px);
  background-size: 50px 50px;
  z-index: 0;
}

/* HERO */
.hero {
  padding: 120px 0;
  position: relative;
  z-index: 1;
}

/* TEXT STYLE */
.gradient-text {
  color: #1e293b;
  font-weight: bold;
}

/* CARDS - LIGHT PORTFOLIO STYLE */
.card {
  background: rgba(255, 255, 255, 0.6);
  border: 1px solid rgba(0,0,0,0.08);
  backdrop-filter: blur(6px);
  transition: 0.3s;
}

.card:hover {
  transform: translateY(-8px);
  border-color: #1e293b;
}

/* NAVBAR FIX */
.navbar {
  background-color: #ffffff !important;
}

.navbar .nav-link,
.navbar-brand {
  color: #1e293b !important;
}

/* BUTTON STYLE */
.btn-primary {
  background-color: #1e293b;
  border: none;
}

.btn-primary:hover {
  background-color: #334155;
}

/* SECTION FIX */
section {
  position: relative;
  z-index: 1;
}

/* FOOTER */
footer {
  background: #e5e2d8;
  color: #1e293b;
}
</style>
</head>

<body class="bg-dark text-white">

<div class="container py-5">
  <h1>About WebWise Studio</h1>
  <p>We specialize in building modern websites for small businesses and schools.</p>

  <div class="row mt-4">
    <div class="col-md-6">
      <div class="p-4 bg-secondary rounded">
        <h5>Our Mission</h5>
        <p>Make digital presence easy and affordable.</p>
      </div>
    </div>

    <div class="col-md-6">
      <div class="p-4 bg-secondary rounded">
        <h5>Our Vision</h5>
        <p>Empower every local business online.</p>
      </div>
    </div>
  </div>
</div>

</body>
</html>
